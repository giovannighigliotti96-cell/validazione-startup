# Motore 24/7 "senza server": GitHub Actions esegue scraping + funnel direttamente.
# Funziona anche se Cloud Run non è deployato. cron-job.org può forzare un run
# chiamando l'endpoint repository_dispatch (vedi README).
#
# Secrets richiesti (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT_B64, FIREBASE_PROJECT_ID, CRON_TOKEN,
#   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, REDDIT_USER_AGENT,
#   PRODUCTHUNT_TOKEN (opz.), SMTP_USER, SMTP_PASSWORD, NOTIFY_EMAIL_TO, NOTIFY_EMAIL_FROM
name: pipeline

on:
  schedule:
    - cron: "17 */6 * * *"      # scraping + funnel ogni 6 ore (UTC)
    - cron: "45 * * * *"        # solo funnel ogni ora
    - cron: "0 7 * * 1"         # digest settimanale (lunedì 07:00 UTC)
    - cron: "30 6 1 * *"        # discovery nuovi verticali + why-now scan (1° del mese)
  workflow_dispatch:
    inputs:
      command:
        description: "scrape | analyze | funnel | all | digest | discover"
        default: "all"
      sources:
        description: "comma-separated sources (empty = all)"
        default: ""
  repository_dispatch:
    types: [run-pipeline]

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.mistral.ai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'mistral-small-latest' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LLM_STRONG_BASE_URL: https://api.groq.com/openai/v1
      LLM_STRONG_MODEL: openai/gpt-oss-120b
      LLM_STRONG_API_KEY: ${{ secrets.LLM_STRONG_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      EMAIL_PROVIDER: smtp
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      ENABLE_TRENDS: "true"
      ENABLE_INDIEHACKERS: "false"
      ENABLE_TRUSTPILOT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decide command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "45 * * * *" ]; then
            echo "command=funnel" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            echo "command=digest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 6 1 * *" ]; then
            echo "command=discover" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "command=${{ github.event.client_payload.command || 'all' }}" >> "$GITHUB_OUTPUT"
          else
            echo "command=${{ github.event.inputs.command || 'all' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        run: |
          SRC="${{ github.event.inputs.sources }}"
          CMD="${{ steps.cmd.outputs.command }}"
          if [ "$CMD" = "discover" ]; then
            python -m scripts.run_pipeline whynow && python -m scripts.run_pipeline discover
          elif [ -n "$SRC" ]; then
            python -m scripts.run_pipeline $CMD --sources "$SRC"
          else
            python -m scripts.run_pipeline $CMD
          fi

      - name: Export CSV artifact
        if: steps.cmd.outputs.command == 'all' || steps.cmd.outputs.command == 'scrape'
        run: python -m scripts.run_pipeline export --out exports/signals.csv --min-wtp 3
      - uses: actions/upload-artifact@v4
        if: steps.cmd.outputs.command == 'all' || steps.cmd.outputs.command == 'scrape'
        with:
          name: signals-csv
          path: exports/signals.csv
          retention-days: 14
